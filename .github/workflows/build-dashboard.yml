name: Rebuild dashboard data

# Triggered per school after an admin uploads raw files (via the Supabase Edge Function
# in supabase/functions/rebuild, which derives school_id from the caller's verified token).
# Also runnable by hand for testing.
#
# The engine runs UNCHANGED. It reads staged inputs from the absolute path
# /home/claude/import_input, takes its key via SCHOOL_KEY_PATH, and writes
# /home/claude/data_real.json (+ flags via FLAGS_PATH). This job's whole job is to
# materialise that exact layout around it, never to modify it.
#
# Role scoping (Sept 2026): the engine also writes per-scope copies under
# SCOPED_OUT_DIR — year/{n}/data.json and tutor/{form}/data.json. These are pushed
# alongside the school-wide file and are what a scoped account actually reads; the
# storage policy is what stops anyone reading a folder that is not theirs.

on:
  repository_dispatch:
    types: [rebuild-dashboard]
  workflow_dispatch:
    inputs:
      school_id:
        description: School slug (matches the storage prefix, e.g. "springfield")
        required: true
      academic_year:
        description: Current academic year start, e.g. 2025 for 2025-26 (blank = derive from today)
        required: false

# One rebuild per school at a time; the newest store always wins (the engine rebuilds
# from the whole accumulated store, so cancelling an older run loses nothing).
concurrency:
  group: rebuild-${{ github.event.client_payload.school_id || inputs.school_id }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest          # ~16 GB RAM — the sandbox OOM is environmental and does not occur here
    timeout-minutes: 20             # job is ~1 minute; headroom only
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_BUCKET: dashboard-data
      SCHOOL_ID: ${{ github.event.client_payload.school_id || inputs.school_id }}
      ACADEMIC_YEAR_IN: ${{ github.event.client_payload.academic_year || inputs.academic_year }}
      SCOPED_OUT_DIR: /home/claude/scoped

    steps:
      - name: Validate inputs (fail closed)
        run: |
          set -euo pipefail
          if [[ ! "${SCHOOL_ID:-}" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]]; then
            echo "::error::Invalid or missing school_id '${SCHOOL_ID:-}'"; exit 1
          fi
          if [[ -n "${ACADEMIC_YEAR_IN:-}" && ! "${ACADEMIC_YEAR_IN}" =~ ^[0-9]{4}$ ]]; then
            echo "::error::academic_year must be a 4-digit year, got '${ACADEMIC_YEAR_IN}'"; exit 1
          fi

      - name: Resolve current academic year (UK Sept–Aug, override allowed)
        run: |
          set -euo pipefail
          if [[ -n "${ACADEMIC_YEAR_IN:-}" ]]; then
            CAY="${ACADEMIC_YEAR_IN}"
          else
            Y=$(date -u +%Y); M=$((10#$(date -u +%m)))
            if [[ "$M" -ge 9 ]]; then CAY="$Y"; else CAY=$((Y-1)); fi
          fi
          echo "CAY=$CAY" >> "$GITHUB_ENV"
          echo "Using academic year start: $CAY"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine dependencies
        run: pip install pandas openpyxl --break-system-packages

      - name: Materialise the engine's expected paths
        run: |
          set -euo pipefail
          sudo mkdir -p /home/claude/import_input /home/claude/scoped
          sudo chown -R "$USER" /home/claude

      - name: Pull this school's raw store + key from Supabase
        run: |
          set -euo pipefail
          python3 ci/pull_store.py \
            --school "$SCHOOL_ID" \
            --raw-dest ./raw \
            --key-dest ./school_key.json

      - name: Stage raw exports -> engine inputs (also emits Roster.csv)
        run: python3 stage_inputs.py ./raw /home/claude/import_input "$CAY"

      - name: Run the import engine (unchanged)
        env:
          SCHOOL_KEY_PATH: ./school_key.json
          FLAGS_PATH: /home/claude/flags.json
        run: python3 import_engine.py

      - name: Push data.json + flags.json back to the school's prefix
        run: |
          set -euo pipefail
          python3 ci/push_outputs.py \
            --school "$SCHOOL_ID" \
            --data /home/claude/data_real.json \
            --flags /home/claude/flags.json

      # Uploads year/{n}/data.json and tutor/{form}/data.json, then removes any
      # scoped file the engine did not produce this run. Pruning is not tidiness:
      # a form that has been renamed or dropped would otherwise leave a readable
      # file behind, and anyone still holding that scope claim could read it.
      - name: Push the scoped files (and prune orphans)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, pathlib, urllib.request, urllib.error

          BASE   = os.environ['SUPABASE_URL'].rstrip('/')
          KEY    = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          BUCKET = os.environ['DATA_BUCKET']
          SCHOOL = os.environ['SCHOOL_ID']
          SRC    = pathlib.Path(os.environ.get('SCOPED_OUT_DIR', '/home/claude/scoped'))

          def call(method, url, body=None, ctype=None):
              req = urllib.request.Request(url, data=body, method=method)
              req.add_header('Authorization', 'Bearer ' + KEY)
              req.add_header('apikey', KEY)
              if ctype:
                  req.add_header('Content-Type', ctype)
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          if not SRC.exists():
              print('::error::no scoped output at %s — is the engine up to date?' % SRC)
              raise SystemExit(1)

          local = sorted(p for p in SRC.rglob('data.json') if p.is_file())
          if not local:
              print('::error::scoped directory is empty — nothing to push')
              raise SystemExit(1)

          pushed = set()
          for path in local:
              rel = path.relative_to(SRC).as_posix()          # tutor/10E1/data.json
              key = f'{SCHOOL}/{rel}'
              status, resp = call(
                  'POST', f'{BASE}/storage/v1/object/{BUCKET}/{key}',
                  path.read_bytes(), 'application/json')
              if status == 400 and b'Duplicate' in resp:       # already there: replace it
                  status, resp = call(
                      'PUT', f'{BASE}/storage/v1/object/{BUCKET}/{key}',
                      path.read_bytes(), 'application/json')
              if status not in (200, 201):
                  print('::error::upload failed %s -> HTTP %s %s' % (key, status, resp[:300]))
                  raise SystemExit(1)
              pushed.add(key)
              print('  pushed %-40s %6.2f MB' % (key, path.stat().st_size / 1048576))

          # Anything under the scoped prefixes that this run did not write is stale.
          for prefix in ('tutor', 'year'):
              status, resp = call(
                  'POST', f'{BASE}/storage/v1/object/list/{BUCKET}',
                  json.dumps({'prefix': f'{SCHOOL}/{prefix}/', 'limit': 1000,
                              'sortBy': {'column': 'name', 'order': 'asc'}}).encode(),
                  'application/json')
              if status != 200:
                  print('::warning::could not list %s/%s (HTTP %s) — skipping prune'
                        % (SCHOOL, prefix, status))
                  continue
              for obj in json.loads(resp):
                  name = obj.get('name') or ''
                  # the list API returns folder entries with no id; ignore those
                  if obj.get('id') is None:
                      continue
                  key = f'{SCHOOL}/{prefix}/{name}'
                  if key not in pushed:
                      st, _ = call('DELETE', f'{BASE}/storage/v1/object/{BUCKET}/{key}')
                      print('  pruned %s (HTTP %s)' % (key, st))

          print('\n%d scoped files pushed for %s' % (len(pushed), SCHOOL))
          PY
